<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Ritual</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Google Fonts: Premium Serif and Clean Geometric Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#F9F6F0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="manifest" href="manifest.json">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #F9F6F0; /* Warm Oat Milk / Cream */
        }
        .serif-title {
            font-family: 'Playfair Display', serif;
        }
    </style>
</head>
<body class="text-[#36221D] min-h-screen flex flex-col justify-between p-6 antialiased selection:bg-[#E6DEC9]">

    <!-- Top Bar -->
    <header class="w-full max-w-md mx-auto flex justify-between items-center pt-6">
        <h1 class="serif-title text-3xl font-medium tracking-tight text-[#4A322B]">
            Your <span class="italic text-[#8C6239]">Ritual</span>
        </h1>
        <div class="flex items-center gap-2">
            <!-- Donation Link / Button -->
            <a href="https://www.buymeacoffee.com/yourusername" target="_blank" rel="noopener noreferrer" class="text-[11px] font-semibold tracking-wider uppercase bg-[#F2ECE0] border border-[#E6DEC9] px-3 py-2 rounded-full text-[#8C6239] hover:bg-[#36221D] hover:text-[#F9F6F0] hover:border-transparent transition-all duration-300 flex items-center gap-1">
                ☕ <span class="hidden sm:inline">Support</span>
            </a>
            <button id="reset-stats" class="text-[11px] font-medium tracking-widest uppercase opacity-40 hover:opacity-100 transition-all bg-[#EDE6D9] px-4 py-2 rounded-full text-[#36221D]">
                Clear Today
            </button>
        </div>
    </header>

    <!-- Main Dynamic Interface -->
    <main class="w-full max-w-md mx-auto flex flex-col items-center justify-center flex-grow my-8">
        
        <!-- Premium Segmented Time Controller -->
        <div class="flex gap-1 mb-14 bg-[#EFE9DC] p-1 rounded-full border border-[#E6DEC9]/60 shadow-inner">
            <button onclick="setTimer(25)" class="time-tab px-6 py-2.5 rounded-full text-xs font-semibold tracking-wider uppercase transition-all duration-300 bg-[#36221D] text-[#F9F6F0] shadow-sm">25m</button>
            <button onclick="setTimer(45)" class="time-tab px-6 py-2.5 rounded-full text-xs font-semibold tracking-wider uppercase transition-all duration-300 text-[#543D36] opacity-60 hover:opacity-100">45m</button>
            <button onclick="setTimer(60)" class="time-tab px-6 py-2.5 rounded-full text-xs font-semibold tracking-wider uppercase transition-all duration-300 text-[#543D36] opacity-60 hover:opacity-100">60m</button>
        </div>

        <!-- The Ritual Circle (With Built-in Time Adjusters) -->
        <div class="relative w-80 h-80 flex items-center justify-center mb-14">
            <!-- Decorative Minimal Rings -->
            <div class="absolute inset-0 rounded-full border border-[#E6DEC9] animate-pulse duration-[4000ms]"></div>
            <div class="absolute inset-4 rounded-full border border-[#EDE6D9]"></div>
            <div class="absolute inset-8 rounded-full bg-[#F3EDE0]/50 backdrop-blur-xs"></div>
            
            <!-- Core Interactive Readout System -->
            <div class="flex items-center justify-between w-full px-6 z-10 select-none">
                <!-- Minus Button -->
                <button onclick="adjustTime(-5)" class="w-10 h-10 rounded-full border border-[#E6DEC9] bg-[#F9F6F0]/80 flex items-center justify-center text-lg font-light hover:bg-[#36221D] hover:text-[#F9F6F0] hover:border-transparent active:scale-90 transition-all duration-200 cursor-pointer" title="Subtract 5 minutes">
                    &minus;
                </button>

                <!-- Central Timer Text -->
                <div class="text-center">
                    <span id="timer-display" class="text-6xl font-extralight tracking-tighter tabular-nums block text-[#241512]">25:00</span>
                    <span id="timer-status" class="text-[10px] uppercase tracking-[0.2em] text-[#8C6239] mt-3 block font-semibold">Ready to Begin</span>
                </div>

                <!-- Plus Button -->
                <button onclick="adjustTime(5)" class="w-10 h-10 rounded-full border border-[#E6DEC9] bg-[#F9F6F0]/80 flex items-center justify-center text-lg font-light hover:bg-[#36221D] hover:text-[#F9F6F0] hover:border-transparent active:scale-90 transition-all duration-200 cursor-pointer" title="Add 5 minutes">
                    &plus;
                </button>
            </div>
        </div>

        <!-- Organic Floating Control Button -->
        <div class="flex items-center justify-center w-full">
            <button id="primary-btn" class="w-48 py-4.5 bg-[#36221D] text-[#F9F6F0] rounded-full text-sm font-semibold tracking-widest uppercase shadow-xl shadow-[#36221D]/10 hover:bg-[#4A322B] active:scale-95 transition-all duration-300">
                Begin Focus
            </button>
        </div>

    </main>

    <!-- Elevated Dynamic Progress Board -->
    <footer class="w-full max-w-md mx-auto bg-[#F2ECE0] rounded-[2rem] p-6 border border-[#E6DEC9]/60 shadow-xs mb-2">
        <div class="flex justify-between items-center px-2">
            <div>
                <p class="text-[10px] uppercase tracking-[0.15em] text-[#8C6239] font-bold mb-1.5">Accumulated Mindful Time</p>
                <p id="total-focus-display" class="text-3xl font-light text-[#241512]"><span class="font-semibold">0</span> mins</p>
            </div>
            <div class="text-right">
                <p class="text-[10px] uppercase tracking-[0.15em] text-[#8C6239] font-bold mb-1.5">Intervals</p>
                <p id="session-count-display" class="text-lg font-medium text-[#4A322B]">0 complete</p>
            </div>
        </div>
    </footer>

    <!-- Core App Logic -->
    <script>
        let countdown;
        let timeLeft = 25 * 60; 
        let initialTime = 25 * 60;
        let isRunning = false;
        
        // Track precise elapsed time in seconds to support partial session metrics
        let secondsTrackedThisSession = 0; 

        const timerDisplay = document.getElementById('timer-display');
        const timerStatus = document.getElementById('timer-status');
        const primaryBtn = document.getElementById('primary-btn');
        const totalFocusDisplay = document.getElementById('total-focus-display');
        const sessionCountDisplay = document.getElementById('session-count-display');
        const resetStatsBtn = document.getElementById('reset-stats');

        // Initialize App & Handle Daily Reset Verification
        window.addEventListener('DOMContentLoaded', () => {
            checkAndResetDailyStats();
            loadStats();
            updateDisplay();
        });

        function checkAndResetDailyStats() {
            const todayStr = new Date().toDateString(); 
            const lastActiveDate = localStorage.getItem('lastActiveDate');

            if (lastActiveDate !== todayStr) {
                if (lastActiveDate) {
                    archivePastSession(lastActiveDate);
                }
                
                localStorage.setItem('focusSeconds', '0'); // Storing raw accumulated seconds now
                localStorage.setItem('focusSessions', '0');
                localStorage.setItem('lastActiveDate', todayStr);
            }
        }

        function archivePastSession(dateString) {
            let history = JSON.parse(localStorage.getItem('ritualHistory') || '{}');
            const pastSeconds = parseInt(localStorage.getItem('focusSeconds') || '0');
            const pastMinutes = Math.floor(pastSeconds / 60);
            const pastSessions = localStorage.getItem('focusSessions') || '0';
            
            if (pastMinutes > 0) {
                history[dateString] = { minutes: pastMinutes, sessions: pastSessions };
                localStorage.setItem('ritualHistory', JSON.stringify(history));
            }
        }

        function updateDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        function setTimer(minutes) {
            // Save any active micro-progress before pivoting parameters
            if (secondsTrackedThisSession > 0) {
                commitPartialTime();
            }
            
            if (isRunning) toggleTimer();
            timeLeft = minutes * 60;
            initialTime = timeLeft;
            updateDisplay();
            timerStatus.textContent = "Ready to Begin";
            clearTabHighlights();
            
            document.querySelectorAll('.time-tab').forEach(tab => {
                if(tab.textContent === `${minutes}m`) {
                    tab.classList.add('bg-[#36221D]', 'text-[#F9F6F0]', 'shadow-sm');
                    tab.classList.remove('text-[#543D36]', 'opacity-60');
                }
            });
        }

        function adjustTime(minuteDelta) {
            // If running, securely log ongoing block values before editing metrics
            if (secondsTrackedThisSession > 0) {
                commitPartialTime();
            }

            let currentMinutes = Math.floor(timeLeft / 60);
            let newMinutes = currentMinutes + minuteDelta;
            
            if (newMinutes < 1) newMinutes = 1;
            if (newMinutes > 180) newMinutes = 180;
            
            timeLeft = newMinutes * 60;
            
            if (!isRunning) {
                initialTime = timeLeft;
                timerStatus.textContent = "Custom Window Set";
                clearTabHighlights();
            }
            
            updateDisplay();
        }

        function clearTabHighlights() {
            document.querySelectorAll('.time-tab').forEach(tab => {
                tab.classList.remove('bg-[#36221D]', 'text-[#F9F6F0]', 'shadow-sm');
                tab.classList.add('text-[#543D36]', 'opacity-60');
            });
        }

        function toggleTimer() {
            if (isRunning) {
                // Pause clicked -> Instantly save partial progress earned so far
                clearInterval(countdown);
                primaryBtn.textContent = "Resume";
                primaryBtn.classList.replace('bg-[#8C6239]', 'bg-[#36221D]');
                timerStatus.textContent = "Ritual Paused";
                isRunning = false;
                
                commitPartialTime();
            } else {
                // Start / Resume clicked
                isRunning = true;
                primaryBtn.textContent = "Pause";
                primaryBtn.classList.replace('bg-[#36221D]', 'bg-[#8C6239]');
                timerStatus.textContent = "In Deep Focus";
                
                countdown = setInterval(() => {
                    if (timeLeft > 0) {
                        timeLeft--;
                        secondsTrackedThisSession++;
                        updateDisplay();
                    } else {
                        clearInterval(countdown);
                        sessionCompleted();
                    }
                }, 1000);
            }
        }

        // Commits whatever partial seconds have accumulated into persistent storage
        function commitPartialTime() {
            if (secondsTrackedThisSession <= 0) return;

            const todayStr = new Date().toDateString();
            localStorage.setItem('lastActiveDate', todayStr);

            let storedSeconds = parseInt(localStorage.getItem('focusSeconds') || '0');
            localStorage.setItem('focusSeconds', storedSeconds + secondsTrackedThisSession);
            
            // Reset counter for the next window block segment
            secondsTrackedThisSession = 0; 
            loadStats();
        }

        function sessionCompleted() {
            isRunning = false;
            
            // Log final ticking elements
            commitPartialTime();
            
            // Increment full interval completion tally
            let todaySessions = parseInt(localStorage.getItem('focusSessions') || '0');
            localStorage.setItem('focusSessions', todaySessions + 1);
            
            timeLeft = initialTime;
            updateDisplay();
            loadStats();
            
            primaryBtn.textContent = "Begin Focus";
            primaryBtn.classList.replace('bg-[#8C6239]', 'bg-[#36221D]');
            timerStatus.textContent = "Ritual Complete";
            
            if (window.AudioContext || window.webkitAudioContext) {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(330, ctx.currentTime);
                osc.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.4);
            }
        }

        function loadStats() {
            // Read raw seconds and convert to a clean, readable minute structure
            const totalSeconds = parseInt(localStorage.getItem('focusSeconds') || '0');
            const minutes = Math.floor(totalSeconds / 60);
            const sessions = localStorage.getItem('focusSessions') || '0';
            
            totalFocusDisplay.innerHTML = `<span class="font-semibold">${minutes}</span> mins`;
            sessionCountDisplay.textContent = `${sessions} complete`;
        }

        resetStatsBtn.addEventListener('click', () => {
            if(confirm("Reset your ritual progress for today?")) {
                localStorage.setItem('focusSeconds', '0');
                localStorage.setItem('focusSessions', '0');
                secondsTrackedThisSession = 0;
                loadStats();
            }
        });

        primaryBtn.addEventListener('click', toggleTimer);

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.log("SW registration failed", err));
        }
    </script>
</body>
</html>
